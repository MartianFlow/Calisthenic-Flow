<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Calisthenic Flow</title>
  <meta name="description" content="Tu hoja de ruta personal de calistenia: progresiones, entrenos y registro de avances.">
  <meta name="theme-color" content="#050507" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#fff2bd" media="(prefers-color-scheme: light)">
  <meta name="color-scheme" content="dark light">
  <script>
    // Tema elegido en Ajustes, aplicado antes de pintar (ver js/theme.js).
    try {
      var cfState = JSON.parse(localStorage.getItem('calisthenic-flow:v1') || '{}');
      var cfTheme = cfState && cfState.settings && cfState.settings.theme;
      if (cfTheme === 'light' || cfTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', cfTheme);
        var cfColor = cfTheme === 'dark' ? '#050507' : '#fff2bd';
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.setAttribute('content', cfColor); });
      }
    } catch (e) { /* sin datos guardados: tema automático */ }
  </script>

  <!-- iOS: app a pantalla completa desde la pantalla de inicio -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Calisthenic">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">

  <link rel="preload" href="fonts/bangers-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js"></script>
</head>
